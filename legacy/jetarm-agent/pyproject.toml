[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jetarm-demo-agent"
version = "0.1.0"
description = "Minimal local orchestrator and thin remote executor for JetArm demo commands"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "openai>=2.0.0",
  "paramiko>=4.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "requests>=2.32.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
jetarm-agent = "jetarm_agent.agent_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
